name: Auto-Update Version Number

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    # Prevent infinite loop when the Action commits the version bump
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to count all commits accurately

      - name: Calculate version and update files
        run: |
          # Add 1 to account for the version-bump commit itself
          COMMIT_COUNT=$(($(git rev-list --count HEAD) + 1))
          NEW_VERSION="v0.${COMMIT_COUNT}"
          echo "Updating to $NEW_VERSION"

          # Update js/app.js
          sed -i "s/const APP_VERSION = \".*\";/const APP_VERSION = \"$NEW_VERSION\";/" js/app.js
          
          # Update index.html fallback text
          sed -i "s/<span id=\"appVersionDisplay\"\(.*\)>v[0-9.]*<\/span>/<span id=\"appVersionDisplay\"\1>$NEW_VERSION<\/span>/" index.html

      - name: Commit updated version
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add js/app.js index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bump version to v0.$(($(git rev-list --count HEAD) + 1)) [skip ci]" && git push)