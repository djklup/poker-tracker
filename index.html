<!-- APPLICATION LOGIC -->
  <script type="module">
    import "./firebase-config.js";

    let currentUser = null;
    let activeSession = null;
    let loggedSessions = [];
    let bankrollTransactions = [];
    let timerInterval = null;
    let performanceChartInstance = null;

    const APP_VERSION = "v0.43"; 
    document.getElementById('appVersionDisplay').textContent = APP_VERSION;

    const PACIFIC_TZ = 'America/Los_Angeles';

    function formatPacificDate(dateString) {
      if (!dateString) return '--';
      return new Date(dateString).toLocaleDateString('en-US', { timeZone: PACIFIC_TZ });
    }

    function formatPacificTime(dateString) {
      if (!dateString) return '--';
      return new Date(dateString).toLocaleTimeString('en-US', { timeZone: PACIFIC_TZ, hour: '2-digit', minute: '2-digit' });
    }

    function getCurrentPacificInputString() {
      const now = new Date();
      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: PACIFIC_TZ,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      const parts = Object.fromEntries(formatter.formatToParts(now).map(p => [p.type, p.value]));
      const hour = parts.hour === '24' ? '00' : parts.hour;
      return `${parts.year}-${parts.month}-${parts.day}T${hour}:${parts.minute}`;
    }

    function isoToPacificLocalInput(isoString) {
      if (!isoString) return getCurrentPacificInputString();
      const date = new Date(isoString);
      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: PACIFIC_TZ,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      const parts = Object.fromEntries(formatter.formatToParts(date).map(p => [p.type, p.value]));
      const hour = parts.hour === '24' ? '00' : parts.hour;
      return `${parts.year}-${parts.month}-${parts.day}T${hour}:${parts.minute}`;
    }

    function pacificInputToISO(localDateTimeString) {
      if (!localDateTimeString) return new Date().toISOString();
      const tempDate = new Date(localDateTimeString);
      const jan = new Date(tempDate.getFullYear(), 0, 1);
      const jul = new Date(tempDate.getFullYear(), 6, 1);
      const stdOffset = Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
      const isDST = tempDate.getTimezoneOffset() < stdOffset;
      const offset = isDST ? '-07:00' : '-08:00';
      return `${localDateTimeString}:00${offset}`;
    }

    function populateDropdowns() {
      const config = window.POKER_CONFIG || { stakes: [], gameTypes: [] };
      
      const fillSelect = (elemId, items, includeAllOption = false, allLabel = 'All Games') => {
        const select = document.getElementById(elemId);
        if (!select) return;
        let html = '';
        if (includeAllOption) {
          html += `<option value="all">${allLabel}</option>`;
        }
        html += items.map(i => `<option value="${i.value}">${i.label}</option>`).join('');
        select.innerHTML = html;
      };

      fillSelect('startGameType', config.gameTypes);
      fillSelect('editGameType', config.gameTypes);
      fillSelect('editActiveGameType', config.gameTypes);
      fillSelect('filterGame', config.gameTypes, true, 'All Games');

      fillSelect('startStakes', config.stakes);
      fillSelect('editStakes', config.stakes);
      fillSelect('editActiveStakes', config.stakes);
      fillSelect('filterStakes', config.stakes, true, 'All Stakes');

      if (loggedSessions.length > 0) {
        const last = loggedSessions[0];
        if (last.gameType) {
          const gtElem = document.getElementById('startGameType');
          if (gtElem) gtElem.value = last.gameType;
        }
        if (last.stakes) {
          const stElem = document.getElementById('startStakes');
          if (stElem) stElem.value = last.stakes;
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.getElementById('loginBtn');

      if (loginBtn) {
        loginBtn.onclick = async () => {
          const fb = window.FirebaseServices;
          if (!fb || !fb.auth || !fb.googleProvider) {
            alert("Firebase services are still loading. Please wait a second and try again.");
            return;
          }

          try {
            loginBtn.textContent = "Signing in...";
            loginBtn.disabled = true;
            await fb.signInWithPopup(fb.auth, fb.googleProvider);
          } catch (err) {
            console.error("Auth Error Details:", err);
            alert("Login Error: " + err.message);
            loginBtn.textContent = "Sign in with Google";
            loginBtn.disabled = false;
          }
        };
      }

      populateDropdowns();

      document.getElementById('filterGame').addEventListener('change', renderDashboardData);
      document.getElementById('filterStakes').addEventListener('change', renderDashboardData);
      document.getElementById('filterTimeframe').addEventListener('change', renderDashboardData);
      document.getElementById('graphMetricSelect').addEventListener('change', renderPerformanceChart);
      
      document.getElementById('resetFiltersBtn').addEventListener('click', () => {
        document.getElementById('filterGame').value = 'all';
        document.getElementById('filterStakes').value = 'all';
        document.getElementById('filterTimeframe').value = 'all';
        renderDashboardData();
      });

      document.getElementById('toggleStartOverride').addEventListener('change', (e) => {
        const container = document.getElementById('startOverrideContainer');
        container.classList.toggle('hidden', !e.target.checked);
        if (e.target.checked && !document.getElementById('startTimeOverride').value) {
          document.getElementById('startTimeOverride').value = getCurrentPacificInputString();
        }
      });
      document.getElementById('toggleEndOverride').addEventListener('change', (e) => {
        const container = document.getElementById('endOverrideContainer');
        container.classList.toggle('hidden', !e.target.checked);
        if (e.target.checked && !document.getElementById('endTimeOverride').value) {
          document.getElementById('endTimeOverride').value = getCurrentPacificInputString();
        }
      });
      document.getElementById('toggleTxOverride').addEventListener('change', (e) => {
        const container = document.getElementById('txOverrideContainer');
        container.classList.toggle('hidden', !e.target.checked);
        if (e.target.checked && !document.getElementById('txTimeOverride').value) {
          document.getElementById('txTimeOverride').value = getCurrentPacificInputString();
        }
      });

      document.getElementById('endHandNum').addEventListener('input', (e) => {
        const noteElem = document.getElementById('handCalcNote');
        const endVal = parseInt(e.target.value, 10);
        if (activeSession && activeSession.startHand && !isNaN(endVal)) {
          const handsPlayed = endVal - activeSession.startHand;
          if (handsPlayed >= 0) {
            noteElem.textContent = `Total hands played this session: ${handsPlayed.toLocaleString()}`;
            noteElem.classList.remove('hidden');
          } else {
            noteElem.textContent = `Warning: Ending hand is below starting hand.`;
            noteElem.classList.remove('hidden');
          }
        } else {
          noteElem.classList.add('hidden');
        }
      });

      const fb = window.FirebaseServices;
      if (fb && fb.auth) {
        fb.onAuthStateChanged(fb.auth, (user) => {
          currentUser = user;
          if (user) {
            document.getElementById('loggedOutNotice').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('loginBtn').classList.add('hidden');
            document.getElementById('userName').textContent = user.displayName || user.email;
            attachFirestoreListeners(fb);
          } else {
            document.getElementById('loggedOutNotice').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('loginBtn').classList.remove('hidden');
            document.getElementById('loginBtn').textContent = "Sign in with Google";
            document.getElementById('loginBtn').disabled = false;
            currentUser = null;
            loggedSessions = [];
            bankrollTransactions = [];
          }
        });
      }

      document.getElementById('logoutBtn').onclick = () => {
        const fb = window.FirebaseServices;
        if (fb) fb.signOut(fb.auth);
      };

      document.getElementById('startSessionBtn').addEventListener('click', () => {
        if (activeSession) {
          alert("You already have an active session in progress!");
          return;
        }
        document.getElementById('toggleStartOverride').checked = false;
        document.getElementById('startOverrideContainer').classList.add('hidden');
        document.getElementById('startTimeOverride').value = '';

        populateDropdowns();

        const lastSession = loggedSessions[0];
        const prevNoteElem = document.getElementById('handPreviousNote');
        const warningElem = document.getElementById('handWarningText');
        
        if (lastSession && lastSession.endHand) {
          prevNoteElem.textContent = `Previous session ended at hand #${lastSession.endHand.toLocaleString()}`;
          prevNoteElem.classList.remove('hidden');
        } else {
          prevNoteElem.classList.add('hidden');
        }
        warningElem.classList.add('hidden');
        document.getElementById('startModal').classList.remove('hidden');
      });

      document.getElementById('closeStartModal').addEventListener('click', () => {
        document.getElementById('startModal').classList.add('hidden');
      });

      document.getElementById('depositWithdrawBtn').addEventListener('click', () => {
        document.getElementById('toggleTxOverride').checked = false;
        document.getElementById('txOverrideContainer').classList.add('hidden');
        document.getElementById('txTimeOverride').value = '';
        document.getElementById('txModal').classList.remove('hidden');
      });

      document.getElementById('closeTxModal').addEventListener('click', () => {
        document.getElementById('txModal').classList.add('hidden');
      });

      document.getElementById('startSessionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const startHand = parseInt(document.getElementById('startHandNum').value, 10);
        const lastSession = loggedSessions[0];

        if (lastSession && lastSession.endHand && startHand < lastSession.endHand) {
          const confirmHand = confirm(`Warning: Starting hand #${startHand.toLocaleString()} is LESS than your previous session's ending hand #${lastSession.endHand.toLocaleString()}.\n\nAre you sure you want to save this starting hand count?`);
          if (!confirmHand) return;
        }

        const isOverride = document.getElementById('toggleStartOverride').checked;
        const overrideTime = document.getElementById('startTimeOverride').value;
        const startTimeISO = (isOverride && overrideTime) ? pacificInputToISO(overrideTime) : new Date().toISOString();

        const sessionData = {
          userId: currentUser.uid,
          gameType: document.getElementById('startGameType').value,
          stakes: document.getElementById('startStakes').value,
          buyIn: parseFloat(document.getElementById('startBuyIn').value),
          startHand: startHand,
          startTime: startTimeISO,
          status: 'active',
          createdAt: fb.serverTimestamp()
        };

        await fb.addDoc(fb.collection(fb.db, 'sessions'), sessionData);
        document.getElementById('startModal').classList.add('hidden');
        document.getElementById('startSessionForm').reset();
      });

      document.getElementById('endSessionBtn').addEventListener('click', () => {
        document.getElementById('toggleEndOverride').checked = false;
        document.getElementById('endOverrideContainer').classList.add('hidden');
        document.getElementById('endTimeOverride').value = '';
        document.getElementById('handCalcNote').classList.add('hidden');
        
        document.getElementById('endModalFormStep').classList.remove('hidden');
        document.getElementById('endModalSummaryStep').classList.add('hidden');
        document.getElementById('endModal').classList.remove('hidden');
      });

      document.getElementById('closeEndModal').addEventListener('click', () => {
        document.getElementById('endModal').classList.add('hidden');
      });

      document.getElementById('dismissSummaryBtn').addEventListener('click', () => {
        document.getElementById('endModal').classList.add('hidden');
        document.getElementById('endSessionForm').reset();
      });

      document.getElementById('editActiveSessionBtn').addEventListener('click', () => {
        if (!activeSession) return;
        document.getElementById('editActiveGameType').value = activeSession.gameType;
        document.getElementById('editActiveStakes').value = activeSession.stakes;
        document.getElementById('editActiveBuyIn').value = activeSession.buyIn;
        document.getElementById('editActiveStartHand').value = activeSession.startHand;
        document.getElementById('editActiveModal').classList.remove('hidden');
      });

      document.getElementById('closeEditActiveModal').addEventListener('click', () => {
        document.getElementById('editActiveModal').classList.add('hidden');
      });

      document.getElementById('editActiveForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!activeSession) return;
        const fb = window.FirebaseServices;
        const sessionRef = fb.doc(fb.db, 'sessions', activeSession.id);
        await fb.updateDoc(sessionRef, {
          gameType: document.getElementById('editActiveGameType').value,
          stakes: document.getElementById('editActiveStakes').value,
          buyIn: parseFloat(document.getElementById('editActiveBuyIn').value),
          startHand: parseInt(document.getElementById('editActiveStartHand').value, 10)
        });
        document.getElementById('editActiveModal').classList.add('hidden');
      });

      document.getElementById('endSessionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!activeSession) return;

        const endHand = parseInt(document.getElementById('endHandNum').value, 10);
        if (endHand < activeSession.startHand) {
          const confirmHand = confirm("Ending hand number is lower than your starting hand number. Proceed anyway?");
          if (!confirmHand) return;
        }

        const isOverride = document.getElementById('toggleEndOverride').checked;
        const overrideTime = document.getElementById('endTimeOverride').value;
        const endTimeISO = (isOverride && overrideTime) ? pacificInputToISO(overrideTime) : new Date().toISOString();
        
        const cashOut = parseFloat(document.getElementById('endCashOut').value);
        const buyIn = activeSession.buyIn;
        const netProfit = cashOut - buyIn;

        const gameType = activeSession.gameType;
        const stakes = activeSession.stakes;
        const startHand = activeSession.startHand;
        const startDt = new Date(activeSession.startTime);
        const endDt = new Date(endTimeISO);
        const durationHrs = Math.max(0.1, (endDt - startDt) / 3600000);
        const totalHandsPlayed = endHand - startHand;
        const hourlyRate = netProfit / durationHrs;
        const per100Rate = totalHandsPlayed > 0 ? (netProfit / totalHandsPlayed) * 100 : 0;

        try {
          const fb = window.FirebaseServices;
          const sessionRef = fb.doc(fb.db, 'sessions', activeSession.id);
          await fb.updateDoc(sessionRef, {
            status: 'completed',
            cashOut: cashOut,
            netProfit: netProfit,
            endHand: endHand,
            endTime: endTimeISO,
            notes: document.getElementById('endNotes').value || ""
          });

          document.getElementById('summaryGameTitle').textContent = `${gameType} (${stakes})`;
          
          const summaryNetElem = document.getElementById('summaryNetProfit');
          summaryNetElem.textContent = `${netProfit >= 0 ? '+' : ''}$${netProfit.toFixed(2)}`;
          summaryNetElem.className = `text-3xl font-extrabold ${netProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
          
          document.getElementById('summaryWalletRange').textContent = `$${cashOut.toFixed(2)} cashout - $${buyIn.toFixed(2)} buyin`;
          document.getElementById('summaryDuration').textContent = `${durationHrs.toFixed(1)} hrs`;
          document.getElementById('summaryHands').textContent = `${totalHandsPlayed.toLocaleString()} hands`;
          
          const summaryHourlyElem = document.getElementById('summaryHourly');
          summaryHourlyElem.textContent = `${hourlyRate >= 0 ? '+' : ''}$${hourlyRate.toFixed(2)}/hr`;
          summaryHourlyElem.className = `text-base font-bold ${hourlyRate >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

          const summaryPer100Elem = document.getElementById('summaryPer100');
          summaryPer100Elem.textContent = `${per100Rate >= 0 ? '+' : ''}$${per100Rate.toFixed(2)}`;
          summaryPer100Elem.className = `text-base font-bold ${per100Rate >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

          document.getElementById('endModalFormStep').classList.add('hidden');
          document.getElementById('endModalSummaryStep').classList.remove('hidden');

        } catch (err) {
          alert("Error ending session: " + err.message);
        }
      });

      document.getElementById('txForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fb = window.FirebaseServices;
        const txType = document.getElementById('txType').value;
        const amount = parseFloat(document.getElementById('txAmount').value);
        const isOverride = document.getElementById('toggleTxOverride').checked;
        const overrideTime = document.getElementById('txTimeOverride').value;
        const timestampISO = (isOverride && overrideTime) ? pacificInputToISO(overrideTime) : new Date().toISOString();

        await fb.addDoc(fb.collection(fb.db, 'transactions'), {
          userId: currentUser.uid,
          type: txType,
          amount: txType === 'deposit' ? amount : -amount,
          note: document.getElementById('txNote').value || "",
          timestamp: timestampISO,
          createdAt: fb.serverTimestamp()
        });

        document.getElementById('txModal').classList.add('hidden');
        document.getElementById('txForm').reset();
      });

      document.getElementById('editSessionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const confirmEdit = confirm("Are you sure you want to save these edits? This will recalculate the session's net profit and duration.");
        if (!confirmEdit) return;

        const fb = window.FirebaseServices;
        const sessionId = document.getElementById('editSessionId').value;
        const buyIn = parseFloat(document.getElementById('editBuyIn').value);
        const cashOut = parseFloat(document.getElementById('editCashOut').value);

        const startTimeISO = pacificInputToISO(document.getElementById('editStartTime').value);
        const endTimeISO = pacificInputToISO(document.getElementById('editEndTime').value);

        const sessionRef = fb.doc(fb.db, 'sessions', sessionId);
        await fb.updateDoc(sessionRef, {
          gameType: document.getElementById('editGameType').value,
          stakes: document.getElementById('editStakes').value,
          startTime: startTimeISO,
          endTime: endTimeISO,
          buyIn: buyIn,
          cashOut: cashOut,
          netProfit: cashOut - buyIn,
          startHand: parseInt(document.getElementById('editStartHand').value, 10),
          endHand: parseInt(document.getElementById('editEndHand').value, 10),
          notes: document.getElementById('editNotes').value
        });

        document.getElementById('editModal').classList.add('hidden');
      });

      document.getElementById('closeEditModal').addEventListener('click', () => {
        document.getElementById('editModal').classList.add('hidden');
      });

      document.getElementById('editTxForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fb = window.FirebaseServices;
        const txId = document.getElementById('editTxId').value;
        const txType = document.getElementById('editTxType').value;
        const amount = parseFloat(document.getElementById('editTxAmount').value);
        const timestampISO = pacificInputToISO(document.getElementById('editTxTimestamp').value);

        const txRef = fb.doc(fb.db, 'transactions', txId);
        await fb.updateDoc(txRef, {
          type: txType,
          amount: txType === 'deposit' ? amount : -amount,
          timestamp: timestampISO,
          note: document.getElementById('editTxNote').value || ""
        });

        document.getElementById('editTxModal').classList.add('hidden');
      });

      document.getElementById('closeEditTxModal').addEventListener('click', () => {
        document.getElementById('editTxModal').classList.add('hidden');
      });

      document.getElementById('exportCsvBtn').addEventListener('click', () => exportToCSV());
    });

    function attachFirestoreListeners(fb) {
      const qSessions = fb.query(fb.collection(fb.db, 'sessions'), fb.orderBy('startTime', 'desc'));
      fb.onSnapshot(qSessions, (snapshot) => {
        loggedSessions = [];
        activeSession = null;
        snapshot.docs.forEach(docSnap => {
          const data = { id: docSnap.id, ...docSnap.data() };
          if (data.userId === currentUser.uid) {
            if (data.status === 'active') activeSession = data;
            else loggedSessions.push(data);
          }
        });
        renderActiveSessionBar();
        renderDashboardData();
      });

      const qTx = fb.query(fb.collection(fb.db, 'transactions'), fb.orderBy('timestamp', 'desc'));
      fb.onSnapshot(qTx, (snapshot) => {
        bankrollTransactions = [];
        snapshot.docs.forEach(docSnap => {
          const data = { id: docSnap.id, ...docSnap.data() };
          if (data.userId === currentUser.uid) bankrollTransactions.push(data);
        });
        renderDashboardData();
      });
    }

    function renderActiveSessionBar() {
      const bar = document.getElementById('activeSessionBar');
      if (!activeSession) {
        bar.classList.add('hidden');
        if (timerInterval) clearInterval(timerInterval);
        return;
      }
      bar.classList.remove('hidden');
      const gameIcon = activeSession.gameType && activeSession.gameType.toLowerCase().includes('plo') ? '♣️' : '♠️';
      document.getElementById('activeGameDetails').textContent = `${gameIcon} ${activeSession.gameType} (${activeSession.stakes})`;
      document.getElementById('activeBuyIn').textContent = `$${activeSession.buyIn.toFixed(2)}`;
      document.getElementById('activeStartTime').textContent = formatPacificTime(activeSession.startTime);
      document.getElementById('activeStartHand').textContent = activeSession.startHand.toLocaleString();

      if (timerInterval) clearInterval(timerInterval);
      const updateTimer = () => {
        const diffMs = new Date() - new Date(activeSession.startTime);
        const hrs = Math.floor(diffMs / 3600000);
        const mins = Math.floor((diffMs % 3600000) / 60000);
        const secs = Math.floor((diffMs % 60000) / 1000);
        document.getElementById('activeTimer').textContent = 
          `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function getFilteredEntries() {
      const gameFilter = document.getElementById('filterGame')?.value || 'all';
      const stakesFilter = document.getElementById('filterStakes')?.value || 'all';
      const timeframeFilter = document.getElementById('filterTimeframe')?.value || 'all';

      const now = new Date();
      const thirtyDaysAgo = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      const filterItem = (item, isSession) => {
        const timestamp = new Date(isSession ? item.startTime : item.timestamp);

        if (timeframeFilter === '30days' && timestamp < thirtyDaysAgo) return false;
        if (timeframeFilter === 'ytd' && timestamp.getFullYear() !== currentYear) return false;
        if (timeframeFilter === 'month' && (timestamp.getFullYear() !== currentYear || timestamp.getMonth() !== currentMonth)) return false;

        if (isSession) {
          if (gameFilter !== 'all' && item.gameType !== gameFilter) return false;
          if (stakesFilter !== 'all' && item.stakes !== stakesFilter) return false;
        }
        return true;
      };

      const filteredSessions = loggedSessions.filter(s => filterItem(s, true));
      const filteredTx = bankrollTransactions.filter(t => filterItem(t, false));

      return { filteredSessions, filteredTx };
    }

    function renderDashboardData() {
      renderUnifiedActivityTable();
      renderPerformanceChart();
    }

    function renderUnifiedActivityTable() {
      const tbody = document.getElementById('activityTableBody');
      const mobileContainer = document.getElementById('mobileActivityCards');

      const { filteredSessions, filteredTx } = getFilteredEntries();

      const combined = [
        ...filteredSessions.map(s => ({ ...s, entryType: 'session', sortTime: new Date(s.startTime).getTime() })),
        ...filteredTx.map(t => ({ ...t, entryType: 'transaction', sortTime: new Date(t.timestamp).getTime() }))
      ].sort((a, b) => b.sortTime - a.sortTime);

      document.getElementById('activityCount').textContent = `${combined.length} entries shown`;

      calculateOverallStats(filteredSessions, filteredTx);

      if (combined.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-gray-500">No recorded sessions or transactions match the selected filters.</td></tr>`;
        mobileContainer.innerHTML = `<div class="p-6 text-center text-gray-500 text-sm">No recorded sessions or transactions match the selected filters.</div>`;
        return;
      }

      // 1. DESKTOP TABLE
      tbody.innerHTML = combined.map(item => {
        if (item.entryType === 'session') {
          const start = new Date(item.startTime);
          const end = new Date(item.endTime);
          const durationHrs = Math.max(0.1, (end - start) / 3600000);
          const totalHands = (item.endHand && item.startHand) ? (item.endHand - item.startHand) : 0;
          const profit = item.netProfit || 0;
          const hourly = profit / durationHrs;
          const per100 = totalHands > 0 ? (profit / totalHands) * 100 : 0;
          
          const isPLO = item.gameType && item.gameType.toLowerCase().includes('plo');
          const gameIcon = isPLO ? '♣️' : '♠️';

          return `
            <tr class="bg-gray-850 hover:bg-gray-750 transition shadow-sm border border-gray-700/60 rounded-xl">
              <td class="py-3 px-3 rounded-l-xl">
                <div class="font-medium text-gray-200">${formatPacificDate(item.startTime)}</div>
                <div class="text-xs text-gray-400">${formatPacificTime(item.startTime)}</div>
              </td>
              <td class="py-3 px-3 font-semibold text-gray-200">
                ${gameIcon} ${item.gameType} <span class="text-xs text-gray-400">(${item.stakes})</span>
              </td>
              <td class="py-3 px-3">${durationHrs.toFixed(1)} hrs</td>
              <td class="py-3 px-3">
                <div>${totalHands > 0 ? totalHands.toLocaleString() + ' hands' : '--'}</div>
                <div class="text-xs text-gray-400">${item.startHand || 0} - ${item.endHand || 0}</div>
              </td>
              <td class="py-3 px-3 font-bold ${profit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                <div>${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}</div>
                <div class="text-xs text-gray-400 font-normal">$${(item.cashOut || 0).toFixed(2)} - $${(item.buyIn || 0).toFixed(2)}</div>
              </td>
              <td class="py-3 px-3 ${hourly >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${hourly.toFixed(2)}/hr</td>

                <button onclick="window.editSession('${item.id}')" class="text-indigo-400 hover:text-indigo-300 font-medium text-xs">Edit</button>

              <td class="py-3 px-3 rounded-l-xl">
                <div class="font-medium text-gray-200">${formatPacificDate(item.timestamp)}</div>
                <div class="text-xs text-gray-400">${formatPacificTime(item.timestamp)}</div>
              </td>
              <td class="py-3 px-3 font-semibold capitalize ${isDeposit ? 'text-emerald-400' : 'text-amber-400'}">
                💳 Bankroll ${item.type}
              </td>
              <td class="py-3 px-3 text-gray-500">--</td>
              <td class="py-3 px-3 text-gray-500">--</td>
              <td class="py-3 px-3 font-bold ${item.amount >= 0 ? 'text-emerald-400' : 'text-amber-400'}">
                ${item.amount >= 0 ? '+' : ''}$${item.amount.toFixed(2)}
              </td>
              <td class="py-3 px-3 text-gray-500">--</td>
              <td class="py-3 px-3 text-gray-500">--</td>
              <td class="py-3 px-3 text-xs text-gray-300">${item.note || '--'}</td>
              <td class="py-3 px-3 text-right space-x-2 rounded-r-xl">
                <button onclick="window.editTransaction('${item.id}')" class="text-indigo-400 hover:text-indigo-300 font-medium text-xs">Edit</button>
                <button onclick="window.deleteTransaction('${item.id}')" class="text-rose-400 hover:text-rose-300 text-xs font-medium">Delete</button>
              </td>
            </tr>
          `;
        }
      }).join('');

      // 2. MOBILE CARDS
      mobileContainer.innerHTML = combined.map(item => {
        if (item.entryType === 'session') {
          const start = new Date(item.startTime);
          const end = new Date(item.endTime);
          const durationHrs = Math.max(0.1, (end - start) / 3600000);
          const totalHands = (item.endHand && item.startHand) ? (item.endHand - item.startHand) : 0;
          const profit = item.netProfit || 0;
          const hourly = profit / durationHrs;
          const per100 = totalHands > 0 ? (profit / totalHands) * 100 : 0;
          
          const isPLO = item.gameType && item.gameType.toLowerCase().includes('plo');
          const gameIcon = isPLO ? '♣️' : '♠️';

          return `
            <div class="p-4 space-y-3 bg-gray-850 rounded-xl border border-gray-700/80 shadow-md">
              <div class="flex justify-between items-start">
                <div>
                  <div class="font-bold text-gray-100 flex items-center space-x-1.5">
                    <span>${gameIcon}</span>
                    <span>${item.gameType}</span>
                    <span class="text-xs text-gray-400 font-normal">(${item.stakes})</span>
                  </div>
                  <div class="text-xs text-gray-400 mt-0.5">
                    ${formatPacificDate(item.startTime)} • ${formatPacificTime(item.startTime)}
                  </div>
                </div>
                <div class="text-right">
                  <div class="text-lg font-extrabold ${profit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                    ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}
                  </div>
                  <div class="text-[11px] text-gray-400">
                    $${(item.cashOut || 0).toFixed(2)} - $${(item.buyIn || 0).toFixed(2)}
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2 bg-gray-900/60 p-2.5 rounded-lg border border-gray-700/50 text-xs">
                <div>
                  <div class="text-gray-400 text-[10px]">DURATION</div>
                  <div class="font-semibold text-gray-200">${durationHrs.toFixed(1)} hrs</div>
                </div>
                <div>
                  <div class="text-gray-400 text-[10px]">HOURLY</div>
                  <div class="font-semibold ${hourly >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${hourly.toFixed(2)}/hr</div>
                </div>
                <div>
                  <div class="text-gray-400 text-[10px]">$/100 HANDS</div>
                  <div class="font-semibold ${per100 >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${totalHands > 0 ? (per100 >= 0 ? '+' : '') + '$' + per100.toFixed(2) : '--'}</div>
                </div>
              </div>

              <div class="flex justify-between items-center text-xs text-gray-300">
                <div>
                  <span class="text-gray-400">Hands:</span> 
                  <span class="font-medium text-gray-200">${totalHands > 0 ? totalHands.toLocaleString() : '--'}</span>
                  <span class="text-[10px] text-gray-400">(${item.startHand || 0}-${item.endHand || 0})</span>
                </div>
              </div>
              ${item.notes ? `<div class="text-xs text-gray-400 italic bg-gray-900/40 p-2 rounded border border-gray-800">"${item.notes}"</div>` : ''}

              <div class="flex justify-end space-x-3 pt-2 border-t border-gray-700/40">
                <button onclick="window.editSession('${item.id}')" class="text-indigo-400 hover:text-indigo-300 font-medium text-xs px-2.5 py-1 bg-indigo-950/40 rounded border border-indigo-900/50">Edit</button>
                <button onclick="window.deleteSession('${item.id}')" class="text-rose-400 hover:text-rose-300 font-medium text-xs px-2.5 py-1 bg-rose-950/40 rounded border border-rose-900/50">Delete</button>

        } else {
          const isDeposit = item.type === 'deposit';
          return `
            <div class="p-4 space-y-2 bg-gray-850/70 rounded-xl border border-gray-700/60 shadow-md">
              <div class="flex justify-between items-start">
                <div class="font-semibold capitalize ${isDeposit ? 'text-emerald-400' : 'text-amber-400'} flex items-center space-x-1.5">
                  <span>💳</span>
                  <span>Bankroll ${item.type}</span>
                </div>
                <div class="text-base font-bold ${item.amount >= 0 ? 'text-emerald-400' : 'text-amber-400'}">
                  ${item.amount >= 0 ? '+' : ''}$${item.amount.toFixed(2)}
                </div>
              </div>
              <div class="text-xs text-gray-400">
                ${formatPacificDate(item.timestamp)} • ${formatPacificTime(item.timestamp)}
              </div>
              ${item.note ? `<div class="text-xs text-gray-300 italic">${item.note}</div>` : ''}
              <div class="flex justify-end space-x-3 pt-1 border-t border-gray-700/40">
                <button onclick="window.editTransaction('${item.id}')" class="text-indigo-400 text-xs">Edit</button>

              </div>

          `;

      }).join('');
    }

    function calculateOverallStats(filteredSessions, filteredTx) {
      let totalSessionProfit = 0;
      let totalHours = 0;
      let totalHands = 0;
      let winningSessionsCount = 0;

      filteredSessions.forEach(s => {
        const profit = s.netProfit || 0;
        totalSessionProfit += profit;
        if (profit > 0) winningSessionsCount++;

        const start = new Date(s.startTime);
        const end = new Date(s.endTime);
        totalHours += Math.max(0, (end - start) / 3600000);

        if (s.endHand && s.startHand) {
          totalHands += (s.endHand - s.startHand);
        }
      });

      const winRatePct = filteredSessions.length > 0 ? Math.round((winningSessionsCount / filteredSessions.length) * 100) : 0;

      let allTxAdjustments = bankrollTransactions.reduce((acc, t) => acc + (t.amount || 0), 0);
      let allSessionProfit = loggedSessions.reduce((acc, s) => acc + (s.netProfit || 0), 0);
      let grandTotalBankroll = allSessionProfit + allTxAdjustments;

      document.getElementById('statBankroll').textContent = `$${grandTotalBankroll.toFixed(2)}`;
      document.getElementById('statNetProfit').textContent = `${totalSessionProfit >= 0 ? '+' : ''}$${totalSessionProfit.toFixed(2)}`;
      document.getElementById('statNetProfit').className = `text-xl md:text-2xl font-bold ${totalSessionProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
      document.getElementById('statHours').textContent = `${totalHours.toFixed(1)} hrs`;
      document.getElementById('statHands').innerHTML = `${totalHands.toLocaleString()} <span class="text-xs font-normal text-gray-400" id="statWinRate">(${winRatePct}% win)</span>`;

      const overallHourly = totalHours > 0 ? (totalSessionProfit / totalHours) : 0;
      document.getElementById('statHourly').textContent = `$${overallHourly.toFixed(2)}/hr`;
      document.getElementById('statHourly').className = `text-xl md:text-2xl font-bold ${overallHourly >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
    }

    function renderPerformanceChart() {
      const ctx = document.getElementById('performanceChart').getContext('2d');
      const metric = document.getElementById('graphMetricSelect').value;

      const titleElem = document.getElementById('graphTitle');
      if (metric === 'hands') titleElem.textContent = "Performance & Bankroll Growth (Cumulative Hands)";
      else if (metric === 'hours') titleElem.textContent = "Performance & Bankroll Growth (Cumulative Hours)";
      else titleElem.textContent = "Performance & Bankroll Growth (Session Timeline)";

      const { filteredSessions } = getFilteredEntries();
      const sorted = [...filteredSessions].sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

      let chartData = [];
      let cumulativeNet = 0;
      let cumulativeHands = 0;
      let cumulativeHours = 0;

      sorted.forEach((s, index) => {
        const profit = s.netProfit || 0;
        cumulativeNet += profit;
        
        const start = new Date(s.startTime);
        const end = new Date(s.endTime);
        const durationHrs = Math.max(0, (end - start) / 3600000);
        cumulativeHours += durationHrs;

        const hands = (s.endHand && s.startHand) ? (s.endHand - s.startHand) : 0;
        cumulativeHands += hands;

        let xVal = index + 1; // Default session index timeline
        if (metric === 'hands') {
          xVal = cumulativeHands;
        } else if (metric === 'hours') {
          xVal = parseFloat(cumulativeHours.toFixed(2));
        }

        chartData.push({ x: xVal, y: cumulativeNet, dateStr: formatPacificDate(s.startTime) });
      });

      if (performanceChartInstance) {
        performanceChartInstance.destroy();
      }

      const isCategory = metric === 'sessions';

      performanceChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Total Net Profit ($)',
            data: chartData.length > 0 ? chartData : [{x: 0, y: 0}],
            borderColor: '#34d399',
            backgroundColor: 'rgba(52, 211, 153, 0.1)',
            borderWidth: 2.5,
            fill: true,
            tension: 0.1,
            pointRadius: 4,
            pointBackgroundColor: '#34d399'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: function(context) {
                  const pt = context[0].raw;
                  if (metric === 'hands') return `Hands Played: ${Number(pt.x).toLocaleString()}`;
                  if (metric === 'hours') return `Hours Played: ${Number(pt.x).toFixed(1)} hrs`;
                  return `Session Date: ${pt.dateStr}`;
                },
                label: function(context) {
                  return ` Net Profit: $${context.parsed.y.toFixed(2)}`;
                }
              }
            }
          },
          scales: {
            x: {
              type: isCategory ? 'category' : 'linear',
              labels: isCategory ? (chartData.length > 0 ? chartData.map(d => d.dateStr) : ['Start']) : undefined,
              grid: { color: 'rgba(55, 65, 81, 0.5)' },
              ticks: { 
                color: '#9ca3af', 
                font: { size: 11 },
                maxTicksLimit: 8,
                callback: function(value) {
                  if (metric === 'hands') return Number(value).toLocaleString();
                  if (metric === 'hours') return Number(value).toFixed(1);
                  return value;
                }
              }
            },
            y: {
              grid: { color: 'rgba(55, 65, 81, 0.5)' },
              ticks: { 
                color: '#9ca3af', 
                font: { size: 11 },
                maxTicksLimit: 6,
                callback: function(value) { return '$' + value; }
              }
            }
          }
        }
      });
    }

    window.editSession = (id) => {
      const s = loggedSessions.find(item => item.id === id);
      if (!s) return;
      document.getElementById('editSessionId').value = s.id;
      document.getElementById('editGameType').value = s.gameType;
      document.getElementById('editStakes').value = s.stakes;
      document.getElementById('editBuyIn').value = s.buyIn;
      document.getElementById('editCashOut').value = s.cashOut || 0;
      document.getElementById('editStartHand').value = s.startHand;
      document.getElementById('editEndHand').value = s.endHand || s.startHand;
      document.getElementById('editStartTime').value = isoToPacificLocalInput(s.startTime);
      document.getElementById('editEndTime').value = isoToPacificLocalInput(s.endTime);
      document.getElementById('editNotes').value = s.notes || "";
      document.getElementById('editModal').classList.remove('hidden');
    };

    window.editTransaction = (id) => {
      const t = bankrollTransactions.find(item => item.id === id);
      if (!t) return;
      document.getElementById('editTxId').value = t.id;
      document.getElementById('editTxType').value = t.type;
      document.getElementById('editTxAmount').value = Math.abs(t.amount);
      document.getElementById('editTxTimestamp').value = isoToPacificLocalInput(t.timestamp);
      document.getElementById('editTxNote').value = t.note || "";
      document.getElementById('editTxModal').classList.remove('hidden');
    };

    window.deleteSession = async (id) => {
      if (confirm("Are you sure you want to delete this session entry permanently?")) {
        const fb = window.FirebaseServices;
        await fb.deleteDoc(fb.doc(fb.db, 'sessions', id));
      }
    };

    window.deleteTransaction = async (id) => {
      if (confirm("Are you sure you want to delete this bankroll deposit/withdrawal record?")) {
        const fb = window.FirebaseServices;
        await fb.deleteDoc(fb.doc(fb.db, 'transactions', id));
      }
    };

    function exportToCSV() {
      if (loggedSessions.length === 0) {
        alert("No session data available to export.");
        return;
      }
      let csv = "Date (PT),Game,Stakes,Start Time (PT),End Time (PT),Hours,Start Hand,End Hand,Total Hands,Net Profit,$/100 Hands,Notes\n";
      loggedSessions.forEach(s => {
        const start = new Date(s.startTime);
        const end = new Date(s.endTime);
        const hrs = ((end - start) / 3600000).toFixed(2);
        const hands = (s.endHand && s.startHand) ? (s.endHand - s.startHand) : 0;
        const profit = s.netProfit || 0;
        const per100 = hands > 0 ? (profit / hands) * 100 : 0;
        const cleanNotes = (s.notes || "").replace(/"/g, '""');
        csv += `"${formatPacificDate(s.startTime)}","${s.gameType}","${s.stakes}","${formatPacificTime(s.startTime)}","${formatPacificTime(s.endTime)}",${hrs},${s.startHand},${s.endHand || ''},${hands},${profit},${per100.toFixed(2)},"${cleanNotes}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `poker_bankroll_export_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
